name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: teachease_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://postgres:test-only-password@localhost:5432/teachease_test
      MIGRATION_DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/teachease_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python scripts/bootstrap_test_db.py
      - run: python scripts/migrate.py
      - run: ruff check app tests scripts
      - run: pytest --cov=app --cov-report=term-missing -q
      - run: python scripts/export_contracts.py
      - run: python scripts/check_contracts.py
      - run: git diff --exit-code -- docs/openapi.json supabase/migrations/0001_schema.sql
      - run: docker build -t teachease-api:test .
