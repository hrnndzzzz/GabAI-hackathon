apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: teachease-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '3'
    spec:
      serviceAccountName: REPLACE_WITH_RUNTIME_SERVICE_ACCOUNT
      containerConcurrency: 20
      timeoutSeconds: 180
      containers:
        - image: REPLACE_WITH_ARTIFACT_REGISTRY_IMAGE_DIGEST
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: '1'
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          env:
            - name: APP_ENV
              value: production
            - name: REQUIRE_MFA
              value: 'true'
            - name: DB_POOL_SIZE
              value: '3'
            - name: DB_MAX_OVERFLOW
              value: '2'
            - name: AI_REQUESTS_PER_MINUTE
              value: '10'
            - name: CORS_ORIGINS
              value: '["https://REPLACE_WITH_FRONTEND_ORIGIN"]'
            - name: SUPABASE_URL
              value: https://REPLACE_WITH_PROJECT.supabase.co
            - name: GEMINI_MODEL
              value: REPLACE_WITH_SUPPORTED_MODEL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: teachease-database-url
                  key: '1'
            - name: SUPABASE_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: teachease-supabase-publishable-key
                  key: '1'
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: teachease-gemini-api-key
                  key: '1'
