[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "teachease-backend"
version = "0.1.0"
description = "Teacher-controlled assessment and instructional assistance API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.135,<1", "uvicorn[standard]>=0.41,<1",
  "pydantic>=2.12,<3", "pydantic-settings>=2.12,<3",
  "sqlalchemy>=2.0.48,<2.1", "psycopg[binary]>=3.3,<4",
  "httpx>=0.28,<1", "google-genai>=2.19,<3",
  "python-multipart>=0.0.22,<1", "Pillow>=12.1,<13",
  "openpyxl>=3.1.5,<4", "defusedxml>=0.7.1,<1", "email-validator>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-cov>=7,<8", "ruff>=0.15,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: real PostgreSQL RLS and transaction integration tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
